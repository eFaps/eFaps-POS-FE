<mat-dialog-content>
  <div class="wrapper">
    <form class="payment-form" [formGroup]="paymentForm">
      <mat-form-field class="example-full-width">
        <input
          matInput
          placeholder="Monto"
          type="text"
          formControlName="amount"
          class="right-align" />
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Tipo de pago</mat-label>
        <mat-select name="paymentTypes" formControlName="paymentType">
          @for (paymentType of paymentTypes; track paymentType) {
            <mat-option [value]="paymentType">
              {{ "PAYMENT." + paymentType | translate }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button (click)="save()" mat-button [disabled]="!paymentForm.valid">
    <mat-icon class="posIcon-36">save</mat-icon>
  </button>
</mat-dialog-actions>
