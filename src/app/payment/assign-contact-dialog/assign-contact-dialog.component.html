<h2 mat-dialog-title>Assignar / Actualizar Contacto</h2>
<mat-dialog-content>
  <div class="wrapper">
  <mat-accordion multi="false">
    <mat-expansion-panel expanded="true"  (opened)="panelOpened('existing')">
      <mat-expansion-panel-header>
        <mat-panel-title> Contactos existentes </mat-panel-title>
      </mat-expansion-panel-header>
     <div class="existing">
      <app-contact (contactSelected)="selectContact($event)"></app-contact>
      </div>
    </mat-expansion-panel>
    <mat-expansion-panel (opened)="panelOpened('new')">
       <mat-expansion-panel-header>
        <mat-panel-title> Contacto nuevo </mat-panel-title>
      </mat-expansion-panel-header>
      <app-create-contact (contactCreated)="selectContact($event)"></app-create-contact>
    </mat-expansion-panel>
  </mat-accordion>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="submit()" [disabled]="!valid()">Actualizar</button>
  <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
