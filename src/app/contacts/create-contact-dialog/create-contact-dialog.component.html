<h1 mat-dialog-title>{{ "CONTACTS.CREATETITLE" | translate }}</h1>
<mat-dialog-content>
  <app-create-contact (contactCreated)="contactCreated($event)"></app-create-contact>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button type="button" [disabled]="!valid()" (click)="submit()">
    {{ "CMD.CREATE" | translate }}
  </button>
  <button mat-button type="button" mat-dialog-close>{{ "CMD.CANCEL" | translate }}</button>
</mat-dialog-actions>
